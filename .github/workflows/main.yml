name: Build Aseprite Windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Skia
        shell: pwsh
        run: |
          mkdir C:\deps\skia
          Invoke-WebRequest -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" -OutFile "C:\deps\skia\skia.zip"
          Expand-Archive -Path "C:\deps\skia\skia.zip" -DestinationPath "C:\deps\skia"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build with CMake and Ninja
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=C:/deps/skia -DSKIA_LIBRARY_DIR=C:/deps/skia/out/Release-x64 -DSKIA_LIBRARY=C:/deps/skia/out/Release-x64/skia.lib -G Ninja ..
          ninja aseprite

      - name: Package Aseprite
        shell: pwsh
        run: |
          mkdir release
          Copy-Item build\bin\aseprite.exe release\
          Copy-Item -Recurse build\bin\data release\data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: release/
